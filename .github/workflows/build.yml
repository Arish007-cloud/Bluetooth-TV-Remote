name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The GitHub runner already has the Android SDK installed.
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk TvRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TvRemote-apk
          path: TvRemote.apk
      # Keeps one "latest" release whose TvRemote.apk can be opened on the phone.
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TvRemote.apk --title "TV Remote (latest build)" --notes "Built from ${GITHUB_SHA::7}. Open TvRemote.apk on your phone to install."
